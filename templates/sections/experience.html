<!--
  experience.html — section partial for Work Experience (#2183).

  Field placeholders filled per entry:
    COMPANY          — employer name
    PERIOD           — date range
    ROLE             — job title
    BULLETS          — rendered <li> tags
    LOCATION_BLOCK   — conditional: .job-location span when location present; omitted when absent

  Jake's Resume layout: two right-aligned rows per entry — bold company with the
  date range opposite, then the italic role with the location opposite — followed
  by the bullet list.

  Template packs: edit tag names, class names, and field order freely inside the ENTRY zone.
-->
<!--ENTRY-->
<div class="job">
  <div class="job-header">
    <span class="job-company">{{COMPANY}}</span>
    <span class="job-period">{{PERIOD}}</span>
  </div>
  <div class="job-subheader">
    <span class="job-role">{{ROLE}}</span>
    {{LOCATION_BLOCK}}
  </div>
  <ul>
    {{BULLETS}}
  </ul>
</div>
<!--LOCATION_BLOCK--><span class="job-location">{{LOCATION}}</span><!--/LOCATION_BLOCK-->
<!--/ENTRY-->
